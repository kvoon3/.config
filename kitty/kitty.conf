# Kitty terminal configuration
# Input Mono; bold/italic styles are matched automatically.
font_family Input Mono
bold_font auto
italic_font auto
bold_italic_font auto

# Font size reduced from default 11.0
font_size 14.0

map super+backspace send_text all \x15

hide_window_decorations no
macos_titlebar_color background

# Background transparency
background_opacity 0.75
background_blur 30

# BEGIN_KITTY_THEME
# Vitesse Dark
include current-theme.conf
# END_KITTY_THEME

# Override theme's titlebar color to match terminal background
macos_titlebar_color background
