onboarding = false

# NOTE: the [theme] and [theme.custom] sections below are managed by
# herdr-theme (./herdr-theme, src/config.ts writeTheme + src/auto.ts), which
# rewrites them on theme switches. Do NOT commit changes to these sections —
# they are generated/automation output, not hand-edits. Only commit changes to
# the other sections ([ui.toast], [experimental], [terminal], etc.).
[theme]
name = "catppuccin-latte"

auto_switch = false

[theme.custom]
accent = "#1c6b48"
panel_bg = "#f1f0e9"
surface0 = "#e7e5db"
surface1 = "#e5e5e3"
surface_dim = "#e7e5db"
overlay0 = "#aaaaaa"
overlay1 = "#999999"
text = "#393a34"
subtext0 = "#999999"
mauve = "#a13865"
green = "#1e754f"
yellow = "#bda437"
red = "#ab5959"
blue = "#296aa3"
teal = "#2993a3"
peach = "#bda437"

[ui.toast]
delivery = "system"

[experimental]
kitty_graphics = true

[terminal]
# TODO: should only used in windows
# default_shell = "C:/Program Files/Git/bin/bash.exe"
# shell_mode = "non_login"

[[keys.command]]
key = "prefix+space"
type = "shell"
command = "\"$HERDR_BIN_PATH\" plugin pane open --plugin cesarferreira.herdr-palette --entrypoint picker"
description = "Open Herdr Palette"
