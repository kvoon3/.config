onboarding = false

# Native light/dark pair (herdr 0.9.0 auto_switch), replacing the removed
# herdr-theme sidecar: vitesse-light-soft = catppuccin-latte + light overrides,
# vitesse-black = tokyo-night + dark overrides.
[theme]
name = "catppuccin-latte"
auto_switch = true
light_name = "catppuccin-latte"
dark_name = "tokyo-night"

[theme.custom.light]
accent = "#1c6b48"
panel_bg = "#f1f0e9"
surface0 = "#e7e5db"
surface1 = "#e5e5e3"
surface_dim = "#e7e5db"
overlay0 = "#aaaaaa"
overlay1 = "#999999"
text = "#393a34"
subtext0 = "#999999"
mauve = "#a13865"
green = "#1e754f"
yellow = "#bda437"
red = "#ab5959"
blue = "#296aa3"
teal = "#2993a3"
peach = "#bda437"

[theme.custom.dark]
accent = "#4d9375"
panel_bg = "#000000"
surface0 = "#121212"
surface1 = "#121212"
surface_dim = "#0f1d17"
overlay0 = "#777777"
overlay1 = "#bfbaaa"
text = "#dbd7ca"
subtext0 = "#bfbaaa"
mauve = "#d9739f"
green = "#4d9375"
yellow = "#e6cc77"
red = "#cb7676"
blue = "#6394bf"
teal = "#5eaab5"
peach = "#e6cc77"

[ui.toast]
delivery = "system"

[experimental]
kitty_graphics = true

[terminal]
# TODO: should only used in windows
# default_shell = "C:/Program Files/Git/bin/bash.exe"
# shell_mode = "non_login"

[[keys.command]]
key = "prefix+space"
type = "shell"
command = "\"$HERDR_BIN_PATH\" plugin pane open --plugin cesarferreira.herdr-palette --entrypoint picker"
description = "Open Herdr Palette"

# A popup custom command already runs in the focused pane's live cwd: Herdr
# passes cwd=None and spawn_popup_command falls back to cwd_for_pane(focused).
# No plugin needed to follow the pane you press the key in.
[[keys.command]]
key = "prefix+shift+l"
type = "popup"
command = "lazygit"
width = "100%"
height = "100%"
description = "Open lazygit"
