# Shared config for every machine. OS-specific tools live in config.macos.toml /
# config.windows.toml, which mise loads automatically because mise/miserc.toml
# sets auto_env = true; config.local.toml (gitignored) is for machine-local
# tweaks. See https://mise.jdx.dev/configuration/environments.html#platform-environments
[settings]
dotfiles.root = "~/.config/dotfiles"
experimental = true
# Disable the 24h release-age filter. mise 2026.6.14 defaults to
# minimum_release_age="24h", which skips versions published <24h ago and
# prints a WARN per tool on every `mise up`. "0s" disables it entirely.
# https://mise.jdx.dev/configuration/settings.html#minimum_release_age
minimum_release_age = "0s"

# GitHub auth: `gh` stores tokens in macOS Keychain, not hosts.yml, so the
# default gh_cli_tokens fallback finds nothing and mise hits the 60 req/h
# unauthenticated rate limit. git credential fill reads Keychain directly.
# https://mise.jdx.dev/dev-tools/github-tokens.html
[settings.github]
use_git_credentials = true
# Disable GitHub Artifact Attestations (Sigstore) verification for the
# github: backend. mise 2026.6.14's bundled Sigstore verifier fails TSA
# timestamp verification for every repo with "no certificate matches
# issuer and serial number" — a mise/Sigstore infra issue, not per-tool.
# SLSA provenance is still verified when the release ships it. Without
# this, `github:` tools (herdr, dark-notify, ...) cannot install at all.
# https://mise.jdx.dev/configuration/settings.html#github-github_attestations
github_attestations = false

[dotfiles]
# Shell rc files are deployed per platform: config.macos.toml supplies
# ~/.zshrc, ~/.zshenv and the macOS ~/.bashrc, config.windows.toml supplies
# the Windows ~/.bashrc. Everything else is the same on both.
"~/.bash_profile" = {}
"~/.gitconfig" = {}
"~/.agents" = {}
"~/.codex" = { source = "~/.config/dotfiles/.codex", mode = "symlink-each" }
"~/.pi/agent" = { source = "~/.config/dotfiles/.pi/agent", mode = "symlink-each" }
"~/.kimi-code" = { source = "~/.config/dotfiles/.kimi-code", mode = "symlink-each" }

[tools]
bun = "1.4.0"
# The mr_boxington cargo wrapper is only enabled in config.macos.toml.
rust = "1"
uv = "latest"

# ── Package managers ──
pnpm = "latest"
"npm:@antfu/ni" = "latest"
# upm — fast npm-registry client
"npm:upm" = "latest"

# ── Editors & terminal ──
neovim = "0.12.4"
tree-sitter = "0.26.12"
harper-ls = "2.8.0"
"npm:unocss-language-server" = "latest"
# TypeScript 7 compiler + language server in Rust (`--lsp -stdio`). nvim prefers
# it for TS/JS outside Vue projects; editors opt in via their own tsdk setting.
"npm:tsrs" = "latest"

# ── Git / CLI utilities ──
gitu = "0"
just = "latest"
lazygit = "latest"
# Explicit repo: the `herdr` shortname in mise's registry aliases to
# github:ogulcancelik/herdr (a fork not in the mise registry → 403 on
# every version lookup). Point at the official github:herdrdev/herdr
# directly to skip the broken alias and the 403 WARN noise.
"github:herdrdev/herdr" = "latest"
ripgrep = "latest"

# ── AI agents ──
# Native binary via mise's http:grok registry entry (same GCS artifacts as
# https://x.ai/cli/install.sh). Prefer `mise up` over `grok update`.
grok = "latest"
# PiG — Pi rebuilt in Go as one native binary (no Node.js), runs Pi's TS
# extensions unchanged. Registry has no `pig` alias → use the repo directly.
# https://github.com/MichaelKinsy/PiG
"github:MichaelKinsy/PiG" = "latest"
"npm:@earendil-works/pi-coding-agent" = "latest"
"npm:@openai/codex" = "latest"
"npm:@moonshot-ai/kimi-code" = "latest"
"npm:@kvoon/bb-cli" = "latest"
# OpenCode 2 (npm package). V1 and V2 both own the `opencode` command, so
# only one may be installed: the npm package ships a native binary via
# optionalDependencies and its postinstall promotes it to `opencode` and
# `opencode2`. mise skips dependency scripts unless allow_builds approves
# them, so the tool must approve itself or the shim errors with
# "@opencode/cli's postinstall script was not run".
# https://opencode.ai/v2/docs/
"npm:@opencode/cli" = { version = "latest", allow_builds = ["@opencode/cli"] }
"npm:agent-browser" = "latest"
# command-code is intentionally not installed: its npm bins are `cmd` and `cmdc`,
# so mise's shims put a cmd.exe on PATH that shadows C:\Windows\System32\cmd.exe
# and breaks everything spawning cmd (npm scripts, lazygit's title probe).
"npm:freebuff" = "latest"

# ── Node dev helpers ──
node = "24"
nub = "latest"
"npm:tsx" = "latest"
"aqua:sharkdp/fd" = "latest"
gh = "latest"
"npm:@kvoon/gop" = "0.1.0"
"npm:ctx7" = "latest"
# The go: backend shells out to `go install`, so the toolchain must be
# managed here too (otherwise `mise up` fails with "go may be required").
go = "latest"
claude = "latest"
"npm:hunkdiff" = "0.23.0"
git-lfs = "latest"
"pipx:ddgr" = "latest"
1password-cli = "latest"
